# SonarQube Cloud, CI-based analysis (.github/workflows/sonar.yml).
# Automatic Analysis must be turned off in the project's settings, or the scan is refused.
sonar.organization=aimindseye
sonar.projectKey=aimindseye_zinwaq25-sableos
sonar.projectName=SableOS for the Zinwa Q25

sonar.sources=.
sonar.tests=tests,sable-src
sonar.test.inclusions=tests/**,**/src/test/**,**/src/androidTest/**,**/src/androidUnitTest/**
sonar.exclusions=tests/**,**/src/test/**,**/src/androidTest/**,**/src/androidUnitTest/**,sable-src/**/build/**,**/.gradle/**,patches/**,out/**
sonar.sourceEncoding=UTF-8

# The host tests under tests/java build against classes extracted from patches at test time,
# so there are no compiled test classes to give the Java analyzer.
sonar.java.test.binaries=out/sonar/empty
sonar.java.binaries=out/sonar/empty

# C: the camera 50 MP remosaic shim, described by scripts/sonar-compile-commands.sh.
sonar.cfamily.compile-commands=out/sonar/compile_commands.json

sonar.python.version=3.12

# No coverage reports are imported yet, so coverage is not measured: without this every
# line of new code counts as uncovered and the "Sonar way" gate (80% on new code) fails.
# Remove it once the workflow imports Kover/JaCoCo reports.
sonar.coverage.exclusions=**/*

# Translatable string tables (key to English, one per line; docs/LANGUAGES.md) read as copy-paste to CPD
# because every line has the same shape. They are data, not duplicated logic.
sonar.cpd.exclusions=sable-src/**/*Text.kt,sable-src/**/*TextTest.kt,sable-src/**/*Lines.kt,sable-src/**/*LinesTest.kt

# Sable Browser must open the http:// pages a user types or follows, and Android's WebView refuses
# them unless the app allows clear-text traffic. Only that manifest is exempt; the browser still
# blocks mixed content on https pages (BrowserWeb.kt). Other Sable apps set it to false, except Cosgrove (below).
sonar.issue.ignore.multicriteria=browserCleartext,assistantCleartext
sonar.issue.ignore.multicriteria.browserCleartext.ruleKey=xml:S5332
sonar.issue.ignore.multicriteria.browserCleartext.resourceKey=sable-src/apps/r8/android/browser/src/main/AndroidManifest.xml
# Cosgrove talks to the owner's Ollama, which serves plain http on the home network. The manifest
# allows clear text, and ServerAddress.allowed refuses plain http to anything but private, .local
# and Tailscale addresses, so hosted providers are always https (tested in CoreTest).
sonar.issue.ignore.multicriteria.assistantCleartext.ruleKey=xml:S5332
sonar.issue.ignore.multicriteria.assistantCleartext.resourceKey=sable-src/apps/r8/android/assistant/src/main/AndroidManifest.xml
