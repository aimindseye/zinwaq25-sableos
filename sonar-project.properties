# SonarQube Cloud, CI-based analysis (.github/workflows/sonar.yml).
# Automatic Analysis must be turned off in the project's settings, or the scan is refused.
sonar.organization=aimindseye
sonar.projectKey=aimindseye_zinwaq25-sableos
sonar.projectName=SableOS for the Zinwa Q25

sonar.sources=.
sonar.tests=tests,sable-src
sonar.test.inclusions=tests/**,**/src/test/**,**/src/androidTest/**,**/src/androidUnitTest/**
sonar.exclusions=tests/**,**/src/test/**,**/src/androidTest/**,**/src/androidUnitTest/**,sable-src/**/build/**,**/.gradle/**,patches/**,out/**
sonar.sourceEncoding=UTF-8

# The host tests under tests/java build against classes extracted from patches at test time,
# so there are no compiled test classes to give the Java analyzer.
sonar.java.test.binaries=out/sonar/empty
sonar.java.binaries=out/sonar/empty

# C: the camera 50 MP remosaic shim, described by scripts/sonar-compile-commands.sh.
sonar.cfamily.compile-commands=out/sonar/compile_commands.json

sonar.python.version=3.12

# No coverage reports are imported yet, so coverage is not measured: without this every
# line of new code counts as uncovered and the "Sonar way" gate (80% on new code) fails.
# Remove it once the workflow imports Kover/JaCoCo reports.
sonar.coverage.exclusions=**/*
