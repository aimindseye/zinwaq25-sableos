name: Security

# SableOS security-baseline: Gitleaks over the history and a MobSF source scan
# of the Android apps (findings recorded, not failing, as in SableOS).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Gitleaks 8.30.1
        run: |
          set -euo pipefail
          v=8.30.1
          curl --proto '=https' --tlsv1.2 -sSfL -o gl.tgz "https://github.com/gitleaks/gitleaks/releases/download/v$v/gitleaks_${v}_linux_x64.tar.gz"
          curl --proto '=https' --tlsv1.2 -sSfL -o sums.txt "https://github.com/gitleaks/gitleaks/releases/download/v$v/gitleaks_${v}_checksums.txt"
          grep " gitleaks_${v}_linux_x64.tar.gz\$" sums.txt | sed "s/gitleaks_${v}_linux_x64.tar.gz/gl.tgz/" | sha256sum -c -
          tar -xzf gl.tgz gitleaks && sudo install gitleaks /usr/local/bin/
      - name: Scan history
        run: gitleaks git --redact --no-banner --exit-code 1 .

  mobsfscan:
    name: MobSF Android source scan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Scan
        run: |
          set -euo pipefail
          pip install --quiet --require-hashes --only-binary :all: -r .github/requirements/mobsfscan.txt
          mobsfscan sable-src/apps --sarif --output mobsfscan-results.sarif --type android --no-fail
          python3 - <<'PY'
          import json, os
          doc = json.load(open("mobsfscan-results.sarif"))
          n = sum(len(r.get("results", [])) for r in doc.get("runs", []))
          print(f"MOBSFSCAN_SARIF_RESULT_COUNT={n}")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(f"MobSF findings recorded: **{n}**\n")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mobsfscan-results
          path: mobsfscan-results.sarif
          retention-days: 30
