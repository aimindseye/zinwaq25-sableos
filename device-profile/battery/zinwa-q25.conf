# SableBatteryProfile for the Zinwa Q25 (ro.sable.profile.id=zinwa-q25).
#
# Read by Settings > Battery (SableOS packages/apps/Settings patches 0201-0203) from
# /system_ext/etc/sable/battery/zinwa-q25.conf. Schema: BATTERY_HEALTH_USAGE_UX section 16.
# Values: YES (device evidence recorded in device-profile/BATTERY.md), NO (evidence that the
# device does not provide it), UNKNOWN (no evidence yet: strict facts and every charging
# control stay unavailable). This profile inherits nothing from Titan 2, Q27 or Panther.
#
# Status 2026-10-09: no Q25 has been examined. Every fact is UNKNOWN until the evidence steps
# in device-profile/BATTERY.md are run on hardware.
schema=1
profile_id=zinwa-q25

health_capacity_supported=UNKNOWN
health_cycle_count_supported=UNKNOWN
health_temperature_supported=UNKNOWN
health_status_supported=UNKNOWN
health_charge_counter_supported=UNKNOWN
health_manufacturing_date_supported=UNKNOWN
health_first_use_date_supported=UNKNOWN
usage_platform_accounting_supported=UNKNOWN

charge_limit_supported=UNKNOWN
charge_limit_values=
adaptive_charging_supported=UNKNOWN
scheduled_charging_supported=UNKNOWN
thermal_protection_status_supported=UNKNOWN

backend_provenance=NONE
mutable_backend_qualified=NO

# Vendor rating (3000 mAh, non-removable), used only as a sanity bound for a reported design
# capacity. Never displayed as a measurement.
spec_design_capacity_mah=3000

evidence=NONE
