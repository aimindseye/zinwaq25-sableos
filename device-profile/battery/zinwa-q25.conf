# SableBatteryProfile for the Zinwa Q25 (ro.sable.profile.id=zinwa-q25).
#
# Read by Settings > Battery (SableOS packages/apps/Settings patches 0201-0203, 1301) from
# /system_ext/etc/sable/battery/zinwa-q25.conf. Schema: BATTERY_HEALTH_USAGE_UX section 16.
# Values: YES (evidence recorded in device-profile/BATTERY.md), NO (evidence that the device
# does not provide it), UNKNOWN (no evidence yet: strict facts and every charging control stay
# unavailable). This profile inherits nothing from Titan 2, Q27 or Panther.
#
# Status 2026-10-22: source evidence, not yet device evidence. Kernel patch
# patches/framework/kernel/xelex/mt6789/0201 makes the MediaTek gauge report its learned cycle
# count and aging-factor capacity (before it, cycle_count was a fixed 1 and both capacities were
# the static profile Q_MAX, the design one off by 10x). The YES facts below rest on that source
# (device-profile/BATTERY.md, "Source evidence"); Q4-BATTERY-HEALTH-Q25 confirms them on a phone,
# and any that fails there goes back to UNKNOWN or NO. Values the gauge has not learned yet
# still read "Not reported".
schema=1
profile_id=zinwa-q25

health_capacity_supported=YES
health_cycle_count_supported=YES
health_temperature_supported=YES
health_status_supported=UNKNOWN
health_charge_counter_supported=UNKNOWN
health_manufacturing_date_supported=NO
health_first_use_date_supported=NO
health_voltage_supported=YES
usage_platform_accounting_supported=UNKNOWN

charge_limit_supported=UNKNOWN
charge_limit_values=
adaptive_charging_supported=UNKNOWN
scheduled_charging_supported=UNKNOWN
thermal_protection_status_supported=UNKNOWN

backend_provenance=NONE
mutable_backend_qualified=NO

# Vendor rating (3000 mAh, non-removable), used only as a sanity bound for a reported design
# capacity. Never displayed as a measurement.
spec_design_capacity_mah=3000

evidence=SOURCE kernel-0201 mtk_battery 2a873a35 (device check pending: Q4-BATTERY-HEALTH-Q25)
